name: Python CI

on:
  push:
    branches:
      - ci-cd

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install .
          pip install -r ./dependencies/simple-libs.txt
          pip install -r ./dependencies/sql.txt
          pip install -r ./dependencies/table-frameworks.txt
          pip install -r ./dependencies/test.txt
      - name: test
        run: |
          source .venv/bin/activate 
          pytest
  deploy:
    runs-on: self-hosted
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: echo 'deploying'
