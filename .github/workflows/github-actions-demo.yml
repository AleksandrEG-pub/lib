name: Python CI

on:
  push:
    branches:
      - ci-cd
      - ci-cd-test

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install .
          pip install -r ./dependencies/simple-libs.txt
          pip install -r ./dependencies/sql.txt
          pip install -r ./dependencies/table-frameworks.txt
          pip install -r ./dependencies/test.txt
          pytest
      - run: git clean -fdx